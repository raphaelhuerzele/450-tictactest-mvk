name: Coverage time series

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate JaCoCo report
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Read current coverage
        run: echo "COVERAGE=$(bash scripts/coverage.sh)" >> "$GITHUB_ENV"

      - name: Checkout existing Pages history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p site/data
          mkdir -p site/coverage

          cp pages/index.html site/index.html
          cp -R build/reports/jacoco/test/html/. site/coverage/

          if [ -f gh-pages/data/coverage.csv ]; then
            cp gh-pages/data/coverage.csv site/data/coverage.csv
          else
            echo "Date,Commit,Coverage" > site/data/coverage.csv
          fi

          short_sha="${GITHUB_SHA:0:7}"
          if ! grep -q ",${short_sha}," site/data/coverage.csv; then
            echo "$(date -u +%Y-%m-%d),${short_sha},${COVERAGE}" >> site/data/coverage.csv
          fi

          echo "## Coverage on main" >> "$GITHUB_STEP_SUMMARY"
          echo "**${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
