name: Dev Container CI

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/devcontainer.json"
      - ".github/workflows/devcontainer-ci.yml"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/devcontainer.json"
      - ".github/workflows/devcontainer-ci.yml"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-in-released-devcontainer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test in released Dev Container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            chmod +x ./gradlew
            ./gradlew clean check --no-daemon
