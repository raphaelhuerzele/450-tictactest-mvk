name: Release TicTacTest

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and changelog
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

          version="${tag#v}"
          bash scripts/extract-release-notes.sh "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean check jar frontendArchive runtimeArchive -PreleaseVersion="$VERSION" --no-daemon

      - name: Test executable JAR
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jar="build/libs/tictactest-${VERSION}.jar"
          test -f "$jar"
          printf '4\n8\n2\n6\n' | java -jar "$jar" | tee jar-smoke-test.log
          grep -q "winner is: CROSS" jar-smoke-test.log
          sha256sum "$jar" > "${jar}.sha256"

      - name: Package release artifacts with checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --test scripts/web/*.test.mjs
          node scripts/web/package-assets.mjs "$VERSION"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release-assets/* \
            --verify-tag \
            --title "TicTacTest v${VERSION}" \
            --notes-file release-notes.md

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
