<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicTacTest – Coverage</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas;
      --fg: CanvasText;
      --muted: GrayText;
      --border: color-mix(in srgb, CanvasText 20%, transparent);
      --accent: #2f81f7;
      --good: #238636;
      --bad: #da3633;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1rem 4rem;
    }

    h1 { margin-bottom: 0.25rem; }
    .muted { color: var(--muted); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 2rem 0;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .label {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .value {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .ok { color: var(--good); }
    .fail { color: var(--bad); }

    .chart-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      overflow-x: auto;
    }

    svg {
      width: 100%;
      min-width: 620px;
      height: 330px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }

    th, td {
      text-align: left;
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    th:last-child, td:last-child { text-align: right; }

    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>JaCoCo Coverage Time Series</h1>
  <p class="muted">TicTacTest · Branch <code>main</code> · eine Messung pro Commit</p>

  <section class="cards" id="cards"></section>

  <section class="chart-card">
    <h2>Verlauf</h2>
    <svg id="chart" viewBox="0 0 800 330" role="img" aria-label="Coverage Verlauf"></svg>
  </section>

  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Commit</th>
        <th>Coverage</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>

  <p><a href="coverage/">Vollständigen JaCoCo HTML-Report öffnen</a></p>
</main>

<script>
const threshold = 90;
const svg = document.getElementById('chart');

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function parseCsv(text) {
  return text.trim()
    .split(/\r?\n/)
    .slice(1)
    .map(line => line.split(','))
    .filter(parts => parts.length >= 3)
    .map(parts => ({
      date: parts[0].trim(),
      commit: parts[1].trim(),
      coverage: Number(parts[2])
    }))
    .filter(row => Number.isFinite(row.coverage));
}

function renderCards(rows) {
  const latest = rows.at(-1);
  const previous = rows.length > 1 ? rows.at(-2) : null;
  const delta = previous ? latest.coverage - previous.coverage : 0;
  const passed = latest.coverage >= threshold;

  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">Aktuell</div>
      <div class="value">${latest.coverage.toFixed(1)}%</div>
      <div class="muted">${escapeHtml(latest.date)} · ${escapeHtml(latest.commit)}</div>
    </div>
    <div class="card">
      <div class="label">Änderung</div>
      <div class="value">${previous ? `${delta >= 0 ? '+' : ''}${delta.toFixed(1)}` : '–'}</div>
      <div class="muted">Prozentpunkte seit letzter Messung</div>
    </div>
    <div class="card">
      <div class="label">Quality Gate</div>
      <div class="value ${passed ? 'ok' : 'fail'}">${passed ? '✓' : '✕'} ${threshold}%</div>
      <div class="muted">${rows.length} Messung(en)</div>
    </div>
  `;
}

function renderTable(rows) {
  document.getElementById('history').innerHTML = rows.slice().reverse().map(row => `
    <tr>
      <td>${escapeHtml(row.date)}</td>
      <td><code>${escapeHtml(row.commit)}</code></td>
      <td>${row.coverage.toFixed(1)}%</td>
    </tr>
  `).join('');
}

function renderChart(rows) {
  const width = 800;
  const height = 330;
  const margin = { left: 55, right: 25, top: 25, bottom: 55 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;

  const minCoverage = Math.max(0, Math.floor(Math.min(...rows.map(r => r.coverage), threshold) - 5));
  const maxCoverage = Math.min(100, Math.ceil(Math.max(...rows.map(r => r.coverage), threshold) + 5));
  const range = Math.max(1, maxCoverage - minCoverage);

  const x = index => margin.left + (rows.length === 1 ? innerWidth / 2 : index * innerWidth / (rows.length - 1));
  const y = value => margin.top + innerHeight - ((value - minCoverage) / range) * innerHeight;

  const parts = [];

  for (let value = minCoverage; value <= maxCoverage; value += 5) {
    parts.push(`<line x1="${margin.left}" y1="${y(value)}" x2="${width - margin.right}" y2="${y(value)}" stroke="currentColor" opacity="0.12"/>`);
    parts.push(`<text x="${margin.left - 8}" y="${y(value) + 4}" text-anchor="end" font-size="11" fill="currentColor" opacity="0.7">${value}%</text>`);
  }

  parts.push(`<line x1="${margin.left}" y1="${y(threshold)}" x2="${width - margin.right}" y2="${y(threshold)}" stroke="currentColor" stroke-dasharray="6 5" opacity="0.55"/>`);
  parts.push(`<text x="${width - margin.right}" y="${y(threshold) - 7}" text-anchor="end" font-size="11" fill="currentColor">Gate ${threshold}%</text>`);

  if (rows.length > 1) {
    const path = rows.map((row, index) => `${index === 0 ? 'M' : 'L'} ${x(index)} ${y(row.coverage)}`).join(' ');
    parts.push(`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`);
  }

  rows.forEach((row, index) => {
    parts.push(`<circle cx="${x(index)}" cy="${y(row.coverage)}" r="5" fill="var(--accent)"><title>${escapeHtml(row.date)} · ${escapeHtml(row.commit)} · ${row.coverage.toFixed(1)}%</title></circle>`);
  });

  const labelStep = Math.max(1, Math.ceil(rows.length / 6));
  rows.forEach((row, index) => {
    if (index % labelStep === 0 || index === rows.length - 1) {
      parts.push(`<text x="${x(index)}" y="${height - 22}" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">${escapeHtml(row.date)}</text>`);
    }
  });

  svg.innerHTML = parts.join('');
}

fetch('data/coverage.csv', { cache: 'no-store' })
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(text => {
    const rows = parseCsv(text);
    if (rows.length === 0) throw new Error('No coverage measurements found');
    renderCards(rows);
    renderTable(rows);
    renderChart(rows);
  })
  .catch(error => {
    document.getElementById('cards').innerHTML = `<div class="card"><strong>Keine Coverage-Daten verfügbar.</strong><div class="muted">${escapeHtml(error.message)}</div></div>`;
  });
</script>
</body>
</html>
