plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'ch.bbw.m450'
version = providers.gradleProperty('releaseVersion').orElse('0.0.0-SNAPSHOT').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    quality {
        java.srcDir 'tools/sonarlint'
    }
}

configurations {
    sonarJava
}

jar {
    archiveBaseName = 'tictactest'
    manifest {
        attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
    testImplementation 'org.quicktheories:quicktheories:0.26'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    qualityImplementation 'org.sonarsource.sonarlint.core:sonarlint-analysis-engine:12.2.0.87867'
    qualityImplementation 'org.sonarsource.sonarlint.core:sonarlint-rule-extractor:12.2.0.87867'
    sonarJava('org.sonarsource.java:sonar-java-plugin:8.45.0.59462') { transitive = false }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

pitest {
    pitestVersion = '1.30.1'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['ch.bbw.m450.tictactoe.*']
    targetTests = ['ch.bbw.m450.tictactoe.*Test']
    threads = 2
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // Keep mutation testing reproducible and independent of JaCoCo instrumentation.
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

check.dependsOn 'pitest'
tasks.named('pitest') {
    mustRunAfter test
}

tasks.register('sonarLint', JavaExec) {
    group = 'verification'
    description = 'Run the SonarLint Java analyzer on production, test and analysis-tool sources.'
    dependsOn testClasses, qualityClasses
    classpath = sourceSets.quality.runtimeClasspath
    mainClass = 'quality.SonarLintCheck'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    doFirst {
        args = [projectDir.absolutePath, configurations.sonarJava.singleFile.absolutePath,
                (sourceSets.test.runtimeClasspath + sourceSets.quality.runtimeClasspath).asPath]
    }
}

check.dependsOn 'sonarLint'
